<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chart - BRIAN & JANATE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent; }
    :root { --primary: #075e54; --secondary: #128c7e; --accent: #25d366;
      --bg-chat: #ece5dd; --sent: #dcf8c6; --received: #ffffff; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #111;
      position: fixed; inset: 0; }

    #loginScreen { display: flex; align-items: center; justify-content: center;
      height: 100vh; height: 100dvh;
      background: linear-gradient(135deg, #075e54, #128c7e);
      padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .login-box { background: white; border-radius: 16px; padding: 40px 30px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin: auto; }
    .login-logo { width: 70px; height: 70px; background: var(--accent);
      border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center;
      justify-content: center; font-size: 32px; }
    .login-box h1 { text-align: center; color: var(--primary); margin-bottom: 8px; font-size: 24px; }
    .login-box .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 13px 15px;
      border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px;
      background: #fafafa; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); background: white; }
    .btn-login { width: 100%; padding: 14px; background: var(--accent); color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-login:hover { background: #1fb855; }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; }
    .error-msg { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 13px; display: none; }

    #chatApp { display: none; flex-direction: column;
      height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
    #chatApp.active { display: flex; }
    .chat-header { background: var(--primary); color: white; padding: 12px 18px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; flex-shrink: 0; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 17px; flex-shrink: 0; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-info h2 { font-size: 16px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-header-info .status { font-size: 12px; opacity: 0.85;
      display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online { background: #4dff88; box-shadow: 0 0 6px #4dff88; }
    .status-dot.offline { background: #999; }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .header-btn { background: rgba(255,255,255,0.15); border: none; color: white;
      padding: 8px 12px; border-radius: 8px; cursor: pointer;
      font-size: 13px; transition: background 0.2s; }
    .header-btn:hover { background: rgba(255,255,255,0.25); }

    .messages-container { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      padding: 20px 15px; display: flex; flex-direction: column; gap: 6px;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: var(--bg-chat);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><g fill="%23d9d0c7" fill-opacity="0.4"><circle cx="10" cy="10" r="1.5"/><circle cx="40" cy="25" r="1.5"/><circle cx="20" cy="45" r="1.5"/><circle cx="50" cy="50" r="1.5"/></g></svg>');
      scroll-behavior: smooth; }
    .message-wrapper { position: relative; display: flex; width: 100%;
      overflow: hidden; flex-shrink: 0; }
    .message-wrapper.sent { justify-content: flex-end; }
    .message-wrapper.received { justify-content: flex-start; }
    .reply-indicator { position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%) scale(0.5); width: 32px; height: 32px;
      border-radius: 50%; background: var(--secondary); display: flex;
      align-items: center; justify-content: center; opacity: 0;
      pointer-events: none; transition: opacity 0.15s, transform 0.15s; z-index: 1; }
    .reply-indicator svg { width: 18px; height: 18px; fill: white; }
    .message-wrapper.swiping .reply-indicator { opacity: 1; transform: translateY(-50%) scale(1); }
    .message { max-width: 75%; padding: 8px 12px; border-radius: 8px;
      font-size: 14.5px; line-height: 1.4; position: relative;
      word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.08);
      animation: fadeIn 0.2s ease; transition: transform 0.2s ease;
      will-change: transform; touch-action: pan-y; z-index: 2; background: var(--received); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .message.sent { background: var(--sent); border-top-right-radius: 0; }
    .message.received { background: var(--received); border-top-left-radius: 0; }
    .message .sender-name { font-size: 11.5px; font-weight: 600; color: var(--secondary); margin-bottom: 2px; }
    .quoted-reply { background: rgba(0,0,0,0.06); border-left: 3px solid var(--secondary);
      padding: 5px 8px; border-radius: 4px; margin-bottom: 5px;
      font-size: 12.5px; cursor: pointer; transition: background 0.15s; }
    .quoted-reply:hover { background: rgba(0,0,0,0.1); }
    .quoted-reply .quoted-name { font-weight: 600; color: var(--secondary);
      display: block; margin-bottom: 1px; font-size: 12px; }
    .quoted-reply .quoted-text { color: #555; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; display: block; max-width: 220px; }
    .message-image { max-width: 100%; max-height: 300px; border-radius: 6px;
      margin-top: 4px; cursor: pointer; display: block; background: #eee; }
    .message-file { display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: rgba(0,0,0,0.05); border-radius: 6px;
      margin-top: 4px; text-decoration: none; color: inherit; font-size: 13px; }
    .message-file svg { width: 24px; height: 24px; fill: var(--secondary); flex-shrink: 0; }
    .message-file .file-name { font-weight: 500; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    .message-voice { display: flex; align-items: center; gap: 8px;
      min-width: 220px; padding: 4px 0; }
    .message-voice audio { flex: 1; height: 36px; max-width: 240px; }
    .voice-icon { width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; }
    .voice-icon svg { width: 16px; height: 16px; fill: white; }
    .message .time { font-size: 10.5px; color: #999; text-align: right;
      margin-top: 3px; display: flex; justify-content: flex-end;
      align-items: center; gap: 3px; }
    .message .checkmark { color: #4fc3f7; font-size: 12px; }
    .message.flash-highlight { animation: flashHighlight 1.2s ease; }
    @keyframes flashHighlight { 0% { background-color: #fff59d; } 100% { background-color: inherit; } }
    .date-divider { align-self: center; background: rgba(255,255,255,0.9);
      color: #666; font-size: 11.5px; padding: 4px 12px; border-radius: 10px;
      margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); flex-shrink: 0; }

    .recording-bar { display: none; padding: 10px 14px; background: #ffe0e0;
      border-top: 1px solid #f5c2c2; align-items: center; gap: 10px; flex-shrink: 0; }
    .recording-bar.active { display: flex; }
    .rec-dot { width: 12px; height: 12px; border-radius: 50%;
      background: #e74c3c; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }
    .recording-bar .rec-label { flex: 1; font-size: 14px; color: #c0392b; font-weight: 500; }
    .recording-bar .rec-time { font-weight: 600; color: #c0392b; font-family: monospace; }
    .rec-btn { width: 46px; height: 46px; border-radius: 50%; background: #e74c3c;
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; transition: background 0.2s, transform 0.1s; }
    .rec-btn svg { width: 20px; height: 20px; fill: white; }
    .rec-btn.recording { background: #c0392b; animation: recPulse 1.2s infinite; }
    @keyframes recPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.6); } 50% { box-shadow: 0 0 0 10px rgba(231,76,60,0); } }

    .reply-preview { display: none; padding: 8px 12px; background: #f0f0f0;
      border-top: 1px solid #ddd; border-left: 4px solid var(--accent);
      align-items: center; gap: 10px; animation: slideUp 0.2s ease; flex-shrink: 0; }
    .reply-preview.active { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .reply-preview-content { flex: 1; overflow: hidden; }
    .reply-preview-content .reply-to-name { font-size: 12px; font-weight: 600;
      color: var(--accent); margin-bottom: 2px; }
    .reply-preview-content .reply-to-text { font-size: 13px; color: #666;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-close-btn { background: transparent; border: none; cursor: pointer;
      padding: 5px; color: #666; font-size: 20px; line-height: 1; }
    .reply-close-btn:hover { color: #333; }

    .upload-progress { display: none; padding: 8px 14px; background: #e3f2fd;
      border-top: 1px solid #bbdefb; align-items: center; gap: 10px; flex-shrink: 0; }
    .upload-progress.active { display: flex; }
    .upload-progress .up-label { flex: 1; font-size: 13px; color: #1565c0; font-weight: 500; }
    .upload-progress .up-bar { width: 100px; height: 6px; background: #bbdefb; border-radius: 3px; overflow: hidden; }
    .upload-progress .up-fill { height: 100%; background: #1976d2; width: 0%; transition: width 0.2s; }
    .upload-progress .up-pct { font-size: 12px; color: #1565c0; font-weight: 600;
      font-family: monospace; min-width: 36px; text-align: right; }

    .message-input-area { padding: 10px 12px; background: #f0f0f0;
      display: flex; align-items: center; gap: 8px;
      border-top: 1px solid #ddd; flex-shrink: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%;
      background: transparent; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s; }
    .icon-btn:hover { background: rgba(0,0,0,0.05); }
    .icon-btn svg { width: 22px; height: 22px; fill: #555; }
    .message-input-area input { flex: 1; padding: 12px 18px; border: none;
      border-radius: 24px; font-size: 15px; background: white;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); min-width: 0; }
    .message-input-area input:focus { outline: none; }
    .send-btn { width: 46px; height: 46px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s; flex-shrink: 0; }
    .send-btn:hover { background: #1fb855; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 22px; height: 22px; fill: white; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 14px; padding: 26px 24px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      max-height: 90vh; overflow-y: auto; }
    .modal h3 { color: var(--primary); margin-bottom: 6px; font-size: 20px; text-align: center; }
    .modal .modal-sub { color: #888; font-size: 13px; text-align: center; margin-bottom: 20px; }
    .modal .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .modal .btn { flex: 1; padding: 12px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .modal .btn-primary { background: var(--accent); color: white; }
    .modal .btn-primary:hover { background: #1fb855; }
    .modal .btn-secondary { background: #eee; color: #444; }
    .modal .btn-secondary:hover { background: #ddd; }
    .modal .btn-danger { background: #e74c3c; color: white; }
    .modal .btn-danger:hover { background: #c0392b; }
    .modal-msg { text-align: center; margin-top: 12px; font-size: 13px; display: none; }
    .modal-msg.error { color: #e74c3c; }
    .modal-msg.success { color: #27ae60; }
    .wallpaper-preview { width: 100%; height: 140px; border-radius: 8px;
      background: #f0f0f0; background-size: cover; background-position: center;
      margin-bottom: 12px; border: 2px dashed #ccc; display: flex;
      align-items: center; justify-content: center; color: #999; font-size: 13px; }

    .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px; }
    .image-viewer.active { display: flex; }
    .image-viewer img { max-width: 95%; max-height: 95%; border-radius: 6px; object-fit: contain; }
    .image-viewer .close-viewer { position: absolute; top: 20px; right: 20px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.2); border: none; color: white;
      font-size: 22px; cursor: pointer; }

    .messages-container::-webkit-scrollbar { width: 6px; }
    .messages-container::-webkit-scrollbar-track { background: transparent; }
    .messages-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 3px; }

    @media (max-width: 600px) {
      .message { max-width: 85%; }
      .chat-header { padding: 10px 12px; gap: 8px; }
      .header-btn { padding: 7px 10px; font-size: 12px; }
      .message-image { max-height: 220px; }
      .messages-container { padding: 14px 10px; }
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <div class="login-logo">💬</div>
      <h1>Chart Platform</h1>
      <p class="subtitle">Private chat for BRIAN & JANATE</p>
      <div class="form-group">
        <label>Select User</label>
        <select id="userSelect">
          <option value="">-- Choose who you are --</option>
          <option value="brian">BRIAN</option>
          <option value="janate">JANATE</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
      </div>
      <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div id="chatApp">
    <div class="chat-header">
      <div class="avatar" id="otherAvatar">J</div>
      <div class="chat-header-info">
        <h2 id="otherName">JANATE</h2>
        <div class="status">
          <span class="status-dot offline" id="statusDot"></span>
          <span id="statusText">is offline</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="wallpaperBtn" onclick="openWallpaperModal()" title="Wallpaper" style="display:none;">🖼️</button>
        <button class="header-btn" onclick="openPasswordModal()" title="Change password">🔒</button>
        <button class="header-btn" onclick="handleLogout()" title="Logout">Logout</button>
      </div>
    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="upload-progress" id="uploadProgress">
      <div class="up-label" id="upLabel">Uploading...</div>
      <div class="up-bar"><div class="up-fill" id="upFill"></div></div>
      <div class="up-pct" id="upPct">0%</div>
    </div>

    <div class="recording-bar" id="recordingBar">
      <div class="rec-dot"></div>
      <div class="rec-label">Recording voice note...</div>
      <div class="rec-time" id="recTime">0:00</div>
      <button class="header-btn" onclick="cancelRecording()" style="background:#eee;color:#c0392b;">✕ Cancel</button>
      <button class="header-btn" onclick="stopAndSendRecording()" style="background:#27ae60;color:white;">✓ Send</button>
    </div>

    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-content">
        <div class="reply-to-name" id="replyToName"></div>
        <div class="reply-to-text" id="replyToText"></div>
      </div>
      <button class="reply-close-btn" onclick="cancelReply()">✕</button>
    </div>

    <div class="message-input-area">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Send image">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)" accept="*/*">
      <input type="file" id="imageInput" style="display:none" onchange="handleImageSelect(event)" accept="image/*">
      <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
      <button class="rec-btn" id="recBtn" onclick="toggleRecording()" title="Record voice">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="passwordModal">
    <div class="modal">
      <h3>Change Password</h3>
      <p class="modal-sub">Update your password</p>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="currentPwd" placeholder="Enter current password">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPwd" placeholder="At least 4 characters">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPwd" placeholder="Re-enter new password">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitPasswordChange()">Update</button>
      </div>
      <div class="modal-msg" id="pwdMsg"></div>
    </div>
  </div>

  <div class="modal-overlay" id="wallpaperModal">
    <div class="modal">
      <h3>Chat Wallpaper</h3>
      <p class="modal-sub">Only BRIAN can change the wallpaper</p>
      <div class="wallpaper-preview" id="wallpaperPreview">No custom wallpaper</div>
      <input type="file" id="wallpaperInput" accept="image/*" style="display:none" onchange="handleWallpaperSelect(event)">
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="document.getElementById('wallpaperInput').click()">Choose Image</button>
        <button class="btn btn-primary" onclick="uploadWallpaper()">Apply</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-danger" onclick="removeWallpaper()" style="width:100%;">Remove Wallpaper</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeWallpaperModal()" style="width:100%;">Close</button>
      </div>
      <div class="modal-msg" id="wallpaperMsg"></div>
    </div>
  </div>

  <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
    <button class="close-viewer" onclick="closeImageViewer()">✕</button>
    <img id="viewerImg" src="" alt="">
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwMM6HyTPQqmXZZ54aDLzPAI5jcU5T6lWF8mU4PXDPlFBZZrifBqmSFi3xmU7oVIRI/exec';

    const CHUNK_SIZE = 5 * 1024 * 1024;
    const MAX_VOICE_SECONDS = 600;
    const MAX_IMAGE_DIMENSION = 1920;
    const IMAGE_QUALITY = 0.82;

    function api(action) {
      const args = Array.prototype.slice.call(arguments, 1);
      const payload = encodeURIComponent(JSON.stringify({ action: action, args: args }));
      const url = API_URL + '?api=' + action + '&payload=' + payload;
      return fetchWithRetry(url, 3);
    }

    function fetchWithRetry(url, retriesLeft) {
      return fetch(url, { method: 'GET', redirect: 'follow' })
        .then(function(r) {
          return r.text().then(function(text) {
            if (text.trim().charAt(0) === '<') {
              console.error('HTML response:', text.slice(0, 300));
              throw new Error('Server error — please try again.');
            }
            try { return JSON.parse(text); }
            catch (e) {
              console.error('Raw response:', text.slice(0, 500));
              throw new Error('Bad response from backend.');
            }
          });
        })
        .catch(function(err) {
          if (retriesLeft > 0 && !err.message.match(/Incorrect|Invalid|Unknown/)) {
            return new Promise(function(resolve) { setTimeout(resolve, 800); })
              .then(function() { return fetchWithRetry(url, retriesLeft - 1); });
          }
          throw err;
        });
    }

    function fileToBase64(fileOrBlob) {
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() { resolve(reader.result.split(',')[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(fileOrBlob);
      });
    }

    function blobToBase64(blob) { return fileToBase64(blob); }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function compressImage(file) {
      return new Promise(function(resolve, reject) {
        if (!file.type.match(/^image\//)) return resolve(file);
        if (file.size < 100 * 1024) return resolve(file);

        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = function() {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          const longest = Math.max(width, height);
          if (longest > MAX_IMAGE_DIMENSION) {
            const scale = MAX_IMAGE_DIMENSION / longest;
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(function(blob) {
            if (!blob) return resolve(file);
            if (blob.size >= file.size) return resolve(file);
            const newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
            const compressed = new File([blob], newName, { type: 'image/jpeg' });
            console.log('Compressed: ' + formatBytes(file.size) + ' -> ' + formatBytes(compressed.size));
            resolve(compressed);
          }, 'image/jpeg', IMAGE_QUALITY);
        };

        img.onerror = function() {
          URL.revokeObjectURL(objectUrl);
          resolve(file);
        };

        img.src = objectUrl;
      });
    }

    function uploadFileChunked(file, onProgress) {
      const uploadId = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

      return (function uploadNext(index) {
        if (index >= totalChunks) {
          return api('finalizeUpload', uploadId, file.name, file.type || 'application/octet-stream', totalChunks)
            .then(function(res) {
              if (!res.success) throw new Error(res.error || 'Finalize failed');
              return res;
            });
        }

        const start = index * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunk = file.slice(start, end);

        return blobToBase64(chunk)
          .then(function(base64) { return api('uploadChunk', uploadId, index, base64); })
          .then(function(res) {
            if (!res.success) throw new Error(res.error || 'Chunk failed');
            const pct = Math.round(((index + 1) / totalChunks) * 100);
            if (onProgress) onProgress(pct);
            return uploadNext(index + 1);
          });
      })(0);
    }

    function attachSwipeHandlers(wrapper, el, msg) {
      let startX = 0, startY = 0, currentX = 0;
      let isSwiping = false, isHorizontal = null;

      function onDown(e) {
        if (e.target.closest('.quoted-reply') || e.target.closest('audio') ||
            e.target.closest('img') || e.target.closest('a')) return;
        const point = e.touches ? e.touches[0] : e;
        startX = point.clientX; startY = point.clientY;
        currentX = 0; isSwiping = false; isHorizontal = null;
        el.style.transition = 'none';
      }

      function onMove(e) {
        if (startX === 0 && startY === 0) return;
        const point = e.touches ? e.touches[0] : e;
        const dx = point.clientX - startX;
        const dy = point.clientY - startY;
        if (dx < 0) return;
        if (isHorizontal === null) {
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            isHorizontal = Math.abs(dx) > Math.abs(dy);
          }
        }
        if (isHorizontal === false) return;
        if (isHorizontal === true && e.cancelable) e.preventDefault();
        isSwiping = true;
        currentX = Math.min(dx, MAX_SWIPE);
        el.style.transform = 'translateX(' + currentX + 'px)';
        if (currentX > 10) wrapper.classList.add('swiping');
        else wrapper.classList.remove('swiping');
      }

      function onUp() {
        if (!isSwiping) {
          el.style.transition = '';
          wrapper.classList.remove('swiping');
          startX = 0; startY = 0;
          return;
        }
        el.style.transition = 'transform 0.2s ease';
        if (currentX >= SWIPE_THRESHOLD) {
          startReply(msg);
          el.style.transform = 'translateX(20px)';
          setTimeout(function() {
            el.style.transform = 'translateX(0)';
            wrapper.classList.remove('swiping');
          }, 200);
        } else {
          el.style.transform = 'translateX(0)';
          wrapper.classList.remove('swiping');
        }
        startX = 0; startY = 0; isSwiping = false; isHorizontal = null;
      }

      el.addEventListener('touchstart', onDown, { passive: true });
      el.addEventListener('touchmove', onMove, { passive: false });
      el.addEventListener('touchend', onUp);
      el.addEventListener('touchcancel', onUp);

      el.addEventListener('mousedown', function(e) {
        if (e.target.closest('.quoted-reply') || e.target.closest('audio') ||
            e.target.closest('img') || e.target.closest('a')) return;
        e.preventDefault();
        onDown(e);
        const moveHandler = function(ev) { onMove(ev); };
        const upHandler = function() {
          onUp();
          document.removeEventListener('mousemove', moveHandler);
          document.removeEventListener('mouseup', upHandler);
        };
        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', upHandler);
      });
    }

      const payload = media ? {

        mimeType: media.mimeType,
        url: media.url || null

      api('sendMessage', chatId, currentUser.userId, currentUser.displayName,
          text || '',
          reply ? reply.messageId : '',
          reply ? reply.senderName : '',
          reply ? reply.message : '',
          type, payload)
        .then(function(result) {
          renderedMessageIds.delete(tempId);
          if (result && result.messageId) renderedMessageIds.add(result.messageId);

        .catch(function(err) {

    function toggleRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopAndSendRecording();
      else startRecording();
    }

    function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Voice recording is not supported here.');
        return;
      }
      if (typeof MediaRecorder === 'undefined') {
        alert('MediaRecorder API is not available.');
        return;
      }

      navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      })
        .then(function(stream) {
          currentStream = stream;
          audioChunks = [];
          discardedRecording = false;

          const candidates = [
            { mime: 'audio/webm;codecs=opus', opts: { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 16000 } },
            { mime: 'audio/webm',             opts: { mimeType: 'audio/webm',             audioBitsPerSecond: 16000 } },
            { mime: 'audio/ogg;codecs=opus',  opts: { mimeType: 'audio/ogg;codecs=opus',  audioBitsPerSecond: 16000 } },
            { mime: 'audio/mp4',              opts: { mimeType: 'audio/mp4',              audioBitsPerSecond: 24000 } }
          ];

          let chosenOpts = null;
          for (let i = 0; i < candidates.length; i++) {
            if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i].mime)) {
              chosenOpts = candidates[i].opts;
              break;
            }
          }

          try {
            mediaRecorder = chosenOpts ? new MediaRecorder(stream, chosenOpts) : new MediaRecorder(stream);
          } catch (err) { mediaRecorder = new MediaRecorder(stream); }

          mediaRecorder.ondataavailable = function(e) {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };
          mediaRecorder.onerror = function(e) { console.error('MediaRecorder error:', e); };

          mediaRecorder.start(1000);
          showRecordingUI();
        })
        .catch(function(err) {
          const name = err && err.name ? err.name : 'UnknownError';
          let friendly = '';
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
            friendly = 'Microphone access was blocked. Allow it in your browser settings and try again.';
          } else if (name === 'NotFoundError') { friendly = 'No microphone found.'; }
          else if (name === 'NotReadableError') { friendly = 'Microphone is in use by another app.'; }
          else { friendly = err.message || ''; }
          alert('❌ ' + name + '\n\n' + friendly);
          console.error(err);
        });
    }

    function showRecordingUI() {
      document.getElementById('recordingBar').classList.add('active');
      document.getElementById('recBtn').classList.add('recording');
      recordingStart = Date.now();
      updateRecordingTime();
      recordingTimer = setInterval(updateRecordingTime, 500);
    }

    function updateRecordingTime() {
      const secs = Math.floor((Date.now() - recordingStart) / 1000);
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      document.getElementById('recTime').textContent = m + ':' + (s < 10 ? '0' : '') + s;
      if (secs >= MAX_VOICE_SECONDS) stopAndSendRecording();
    }

    function stopAndSendRecording() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
      clearInterval(recordingTimer);

      const elapsed = Date.now() - recordingStart;
      if (elapsed < 500) discardedRecording = true;

      mediaRecorder.onstop = function() {
        if (currentStream) {
          currentStream.getTracks().forEach(function(t) { t.stop(); });
          currentStream = null;
        }
        document.getElementById('recordingBar').classList.remove('active');
        document.getElementById('recBtn').classList.remove('recording');

        if (discardedRecording) {
          discardedRecording = false;
          audioChunks = [];
          return;
        }

        const blob = new Blob(audioChunks, { type: audioChunks[0] ? audioChunks[0].type : 'audio/webm' });
        audioChunks = [];
        if (blob.size < 500) return;

        const reply = replyingTo;
        cancelReply();
        showUploadProgress('Uploading voice note (' + formatBytes(blob.size) + ')...');

        const ext = blob.type.indexOf('mp4') !== -1 ? 'm4a' :
                    blob.type.indexOf('ogg') !== -1 ? 'ogg' : 'webm';

        if (blob.size <= CHUNK_SIZE * 0.8) {
          blobToBase64(blob)
            .then(function(base64) {
              updateUploadProgress(100);
              sendToServer('voice', '', {
                base64: base64,
                fileName: 'voice_' + Date.now() + '.' + ext,
                mimeType: blob.type || 'audio/webm',
                previewURL: null
              }, reply);
              hideUploadProgress();
            })
            .catch(function(err) {
              hideUploadProgress();
              alert('Voice upload failed: ' + err.message);
              console.error(err);
            });
        } else {
          uploadFileChunked(new File([blob], 'voice_' + Date.now() + '.' + ext, { type: blob.type }), function(pct) {
            updateUploadProgress(pct);
          })
            .then(function(res) {
              sendToServer('voice', '', {
                url: res.url,
                fileName: res.name || 'voice.' + ext,
                mimeType: blob.type || 'audio/webm',
                previewURL: res.url
              }, reply);
              hideUploadProgress();
            })
            .catch(function(err) {
              hideUploadProgress();
              alert('Voice upload failed: ' + err.message);
              console.error(err);
            });
        }
      };

      mediaRecorder.stop();
    }

    function cancelRecording() {
      if (!mediaRecorder) return;
      clearInterval(recordingTimer);
      discardedRecording = true;
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.onstop = function() {
          if (currentStream) {
            currentStream.getTracks().forEach(function(t) { t.stop(); });
            currentStream = null;
          }
        };
        mediaRecorder.stop();
      }
      audioChunks = [];
      document.getElementById('recordingBar').classList.remove('active');
      document.getElementById('recBtn').classList.remove('recording');
    }

    function openPasswordModal() {
      document.getElementById('currentPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('confirmPwd').value = '';
      document.getElementById('pwdMsg').style.display = 'none';
      document.getElementById('passwordModal').classList.add('active');
    }
    function closePasswordModal() { document.getElementById('passwordModal').classList.remove('active'); }

    function submitPasswordChange() {
      const cur = document.getElementById('currentPwd').value;
      const nw = document.getElementById('newPwd').value;
      const cf = document.getElementById('confirmPwd').value;
      const m = document.getElementById('pwdMsg');

      function showMsg(text, cls) {
        m.textContent = text;
        m.className = 'modal-msg ' + cls;
        m.style.display = 'block';
      }

      if (!cur || !nw || !cf) return showMsg('Please fill all fields', 'error');
      if (nw !== cf) return showMsg('New passwords do not match', 'error');
      if (nw.length < 4) return showMsg('Password too short (min 4)', 'error');

      api('changePassword', currentUser.userId, cur, nw)
        .then(function(res) {
          if (res.success) {
            showMsg('Password updated!', 'success');
            setTimeout(closePasswordModal, 1200);
          } else { showMsg(res.error || 'Failed', 'error'); }
        })
        .catch(function(err) { showMsg('Error: ' + err.message, 'error'); });
    }

    function openWallpaperModal() {
      if (currentUser.userId !== 'brian_001') return;
      document.getElementById('wallpaperMsg').style.display = 'none';
      pendingWallpaper = null;
      refreshWallpaperPreview();
      document.getElementById('wallpaperModal').classList.add('active');
    }
    function closeWallpaperModal() { document.getElementById('wallpaperModal').classList.remove('active'); }

    function refreshWallpaperPreview() {
      const preview = document.getElementById('wallpaperPreview');
      if (pendingWallpaper) {
        preview.style.backgroundImage = 'url(' + pendingWallpaper.dataURL + ')';
        preview.textContent = '';
      } else {
        const c = document.getElementById('messagesContainer');
        const bg = c.style.backgroundImage;
        if (bg && bg !== 'none') {
          preview.style.backgroundImage = bg;
          preview.textContent = '';
        } else {
          preview.style.backgroundImage = '';
          preview.textContent = 'No custom wallpaper';
        }
      }
    }

    function handleWallpaperSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const msg = document.getElementById('wallpaperMsg');
      msg.textContent = 'Compressing...';
      msg.className = 'modal-msg';
      msg.style.display = 'block';

      compressImage(file)
        .then(function(compressed) {
          return fileToBase64(compressed).then(function(base64) {
            pendingWallpaper = {
              base64: base64,
              mimeType: compressed.type || 'image/jpeg',
              fileName: compressed.name,
              dataURL: 'data:' + (compressed.type || 'image/jpeg') + ';base64,' + base64
            };
            refreshWallpaperPreview();
            msg.style.display = 'none';
          });
        })
        .catch(function(err) {
          msg.textContent = 'Failed to load image: ' + err.message;
          msg.className = 'modal-msg error';
        })
        .finally(function() { e.target.value = ''; });
    }

    function uploadWallpaper() {
      const m = document.getElementById('wallpaperMsg');
      if (!pendingWallpaper) {
        m.textContent = 'Please choose an image first';
        m.className = 'modal-msg error';
        m.style.display = 'block';
        return;
      }
      m.textContent = 'Uploading...';
      m.className = 'modal-msg';
      m.style.display = 'block';

      api('setWallpaper', currentUser.userId, pendingWallpaper.base64, pendingWallpaper.mimeType, pendingWallpaper.fileName)
        .then(function(res) {
          if (res.success) {
            applyWallpaper(res.url);
            m.textContent = 'Wallpaper updated!';
            m.className = 'modal-msg success';
            pendingWallpaper = null;
            setTimeout(closeWallpaperModal, 1200);
          } else {
            m.textContent = res.error || 'Failed';
            m.className = 'modal-msg error';
          }
        })
        .catch(function(err) {
          m.textContent = 'Error: ' + err.message;
          m.className = 'modal-msg error';
        });
    }

    function removeWallpaper() {
      api('clearWallpaper', currentUser.userId)
        .then(function(res) {
          if (res.success) {
            const c = document.getElementById('messagesContainer');
            c.style.backgroundImage = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"60\" height=\"60\" viewBox=\"0 0 60 60\"><g fill=\"%23d9d0c7\" fill-opacity=\"0.4\"><circle cx=\"10\" cy=\"10\" r=\"1.5\"/><circle cx=\"40\" cy=\"25\" r=\"1.5\"/><circle cx=\"20\" cy=\"45\" r=\"1.5\"/><circle cx=\"50\" cy=\"50\" r=\"1.5\"/></g></svg>')";
            const m = document.getElementById('wallpaperMsg');
            m.textContent = 'Wallpaper removed';
            m.className = 'modal-msg success';
            m.style.display = 'block';
            setTimeout(closeWallpaperModal, 1000);
          }
        });
    }

    function applyWallpaper(url) {
      const c = document.getElementById('messagesContainer');
      c.style.backgroundImage = 'url(' + url + ')';
    }

    function loadWallpaper() {
      api('getWallpaper')
        .then(function(url) { if (url) applyWallpaper(url); })
        .catch(function(e) { console.error(e); });
    }

    function openImageViewer(url) {
      document.getElementById('viewerImg').src = url;
      document.getElementById('imageViewer').classList.add('active');
    }
    function closeImageViewer() {
      document.getElementById('imageViewer').classList.remove('active');
      document.getElementById('viewerImg').src = '';
    }

    function startPolling() {
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(function() {
        loadMessages(false);
        updateStatus();
      }, 2000);
    }

    function scrollToBottom(force) {
      const c = document.getElementById('messagesContainer');
      if (!force && userHasScrolledUp) return;
      requestAnimationFrame(function() { c.scrollTop = c.scrollHeight; });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
